name: Build my SideStore

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned SideStore IPA
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          NORMALIZED_VERSION="${MARKETING_VERSION}-own.${GITHUB_RUN_NUMBER}+${SHORT_COMMIT}"
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      - name: Build
        run: |
          python3 scripts/ci/workflow.py build; STATUS=$?
          mv SideStore.ipa SideStore-own.ipa || true
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SideStore-own.ipa
          path: SideStore-own.ipa
